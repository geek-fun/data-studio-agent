name: Release MCP package

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/data-studio-mcp/package-lock.json

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#mcp-}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Install dependencies
        working-directory: packages/data-studio-mcp
        run: npm ci

      - name: Typecheck
        working-directory: packages/data-studio-mcp
        run: npx tsc --noEmit

      - name: Build
        working-directory: packages/data-studio-mcp
        run: npm run build

      - name: Test
        working-directory: packages/data-studio-mcp
        run: npm test

      - name: Verify version matches tag
        working-directory: packages/data-studio-mcp
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version match: $PKG_VERSION"

      - name: Publish to npm
        working-directory: packages/data-studio-mcp
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `@geekfun/data-studio-mcp v${process.env.VERSION}`,
              body: `## Install\n\n\`\`\`bash\nnpx @geekfun/data-studio-mcp\n\`\`\`\n\nRequires [dockit](https://github.com/geek-fun/dockit) or [sqlkit](https://github.com/geek-fun/sqlkit) running on the same machine.`,
              draft: false,
              prerelease: false,
            });
