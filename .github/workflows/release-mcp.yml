name: Release MCP package

on:
  push:
    branches: [master]
    paths:
      - 'packages/data-studio-mcp/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_new: ${{ steps.version.outputs.is_new }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version and check tag
        id: version
        run: |
          VERSION=$(node -p "require('./packages/data-studio-mcp/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          TAG="data-studio-mcp-v$VERSION"
          if git tag --list | grep -qx "$TAG"; then
            echo "Tag $TAG already exists, skipping"
            echo "is_new=false" >> $GITHUB_OUTPUT
          else
            echo "New version: $VERSION"
            echo "is_new=true" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Release data-studio-mcp-v${{ needs.check-version.outputs.version }}
    needs: check-version
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11.5.1+ — required for npm OIDC trusted publishing
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/data-studio-mcp/package-lock.json

      - name: Install dependencies
        working-directory: packages/data-studio-mcp
        run: npm ci

      - name: Lint check
        working-directory: packages/data-studio-mcp
        run: npm run lint:check

      - name: Typecheck
        working-directory: packages/data-studio-mcp
        run: npx tsc --noEmit

      - name: Build
        working-directory: packages/data-studio-mcp
        run: npm run build

      - name: Test
        working-directory: packages/data-studio-mcp
        run: npm test

      - name: Publish to npm
        working-directory: packages/data-studio-mcp
        run: npm publish --access public --provenance

      - name: Publish to MCP Registry
        working-directory: packages/data-studio-mcp
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Create tag and GitHub release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        with:
          script: |
            const tag = `data-studio-mcp-v${process.env.VERSION}`;

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `@geek-fun/data-studio-mcp v${process.env.VERSION}`,
              body: `## Install\n\n\`\`\`bash\nnpx @geek-fun/data-studio-mcp\n\`\`\`\n\nRequires [dockit](https://github.com/geek-fun/dockit) or [sqlkit](https://github.com/geek-fun/sqlkit) running on the same machine.`,
              draft: false,
              prerelease: false,
            });
