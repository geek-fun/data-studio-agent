name: MCP CI

on:
  push:
    branches: [master]
    paths:
      - 'packages/data-studio-mcp/**'
  pull_request:
    branches: [master]
    paths:
      - 'packages/data-studio-mcp/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24.x]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Github checkout
        uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/data-studio-mcp/package-lock.json

      - name: Install dependencies
        working-directory: packages/data-studio-mcp
        run: npm ci

      - name: Lint check
        working-directory: packages/data-studio-mcp
        run: npm run lint:check

      - name: Security audit
        working-directory: packages/data-studio-mcp
        run: npm audit --audit-level=critical

      - name: Build
        working-directory: packages/data-studio-mcp
        run: npm run build

      - name: Test with coverage
        working-directory: packages/data-studio-mcp
        run: npm run test:ci

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v4
        with:
          directory: packages/data-studio-mcp
          verbose: true
          fail_ci_if_error: true
