name: MCP CI

on:
  push:
    branches: [master]
    paths:
      - 'packages/data-studio-mcp/**'
  pull_request:
    branches: [master]
    paths:
      - 'packages/data-studio-mcp/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: packages/data-studio-mcp/package-lock.json

      - name: Install dependencies
        working-directory: packages/data-studio-mcp
        run: npm ci

      - name: Typecheck
        working-directory: packages/data-studio-mcp
        run: npx tsc --noEmit

      - name: Build
        working-directory: packages/data-studio-mcp
        run: npm run build

      - name: Test
        working-directory: packages/data-studio-mcp
        run: npm test
