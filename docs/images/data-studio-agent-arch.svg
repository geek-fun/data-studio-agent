<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="1280" height="747" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="boxbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f7f8"/>
    </linearGradient>
    <linearGradient id="brandbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8a34e"/>
      <stop offset="1" stop-color="#f0812e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b9bec7"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="560" fill="#fbfaf8" rx="16"/>

  <!-- Title -->
  <text x="480" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Data Studio Agent — Architecture</text>

  <!-- Top: AI Coding Agent -->
  <rect x="330" y="70" width="300" height="58" rx="10" fill="url(#boxbg)" stroke="#e3e4e8" stroke-width="1.2"/>
  <text x="480" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">AI Coding Agent</text>
  <text x="480" y="114" text-anchor="middle" font-size="12" fill="#6b7280">Claude Code · Cursor · Windsurf · OpenCode · Codex</text>

  <!-- arrow down -->
  <line x1="480" y1="128" x2="480" y2="166" stroke="#b9bec7" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="520" y="152" font-size="11.5" fill="#6b7280">MCP stdio protocol</text>

  <!-- Middle: npm package -->
  <rect x="305" y="170" width="350" height="58" rx="10" fill="url(#brandbg)" stroke="none"/>
  <text x="480" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">@geek-fun/data-studio-mcp</text>
  <text x="480" y="215" text-anchor="middle" font-size="12" fill="#fff8f0">npm package · pure TypeScript · thin routing layer</text>

  <!-- arrow down split -->
  <line x1="480" y1="228" x2="480" y2="258" stroke="#b9bec7" stroke-width="1.6"/>
  <line x1="290" y1="258" x2="670" y2="258" stroke="#b9bec7" stroke-width="1.6"/>
  <line x1="290" y1="258" x2="290" y2="296" stroke="#b9bec7" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="670" y1="258" x2="670" y2="296" stroke="#b9bec7" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="480" y="252" text-anchor="middle" font-size="11.5" fill="#6b7280">HTTP · 127.0.0.1 only</text>

  <!-- Backends row -->
  <!-- dockit -->
  <rect x="120" y="300" width="340" height="90" rx="12" fill="url(#boxbg)" stroke="#e3e4e8" stroke-width="1.2"/>
  <circle cx="160" cy="330" r="16" fill="#f0812e"/>
  <text x="160" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">DK</text>
  <text x="190" y="330" font-size="15" font-weight="700" fill="#1a1a1a">dockit · :9120</text>
  <text x="190" y="350" font-size="12" fill="#6b7280">NoSQL bridge</text>
  <text x="160" y="378" text-anchor="middle" font-size="11.5" fill="#6b7280">Elasticsearch · OpenSearch · MongoDB · DynamoDB</text>

  <!-- sqlkit -->
  <rect x="500" y="300" width="340" height="90" rx="12" fill="url(#boxbg)" stroke="#e3e4e8" stroke-width="1.2"/>
  <circle cx="540" cy="330" r="16" fill="#f0812e"/>
  <text x="540" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">SK</text>
  <text x="570" y="330" font-size="15" font-weight="700" fill="#1a1a1a">sqlkit · :9121</text>
  <text x="570" y="350" font-size="12" fill="#6b7280">SQL bridge</text>
  <text x="540" y="378" text-anchor="middle" font-size="11.5" fill="#6b7280">PostgreSQL · MySQL · SQL Server · SQLite</text>

  <!-- arrows down -->
  <line x1="290" y1="390" x2="290" y2="430" stroke="#b9bec7" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="670" y1="390" x2="670" y2="430" stroke="#b9bec7" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="480" y="418" text-anchor="middle" font-size="11.5" fill="#6b7280">drivers · SSH tunnels · connection management (inside the apps)</text>

  <!-- bottom: databases -->
  <rect x="120" y="436" width="720" height="64" rx="12" fill="#f3f1ee" stroke="#e6e0d8" stroke-width="1.2"/>
  <text x="480" y="462" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5563">Your databases — credentials never leave the desktop apps</text>
  <text x="480" y="484" text-anchor="middle" font-size="11.5" fill="#8a8f98">Read-safe tools only · destructive &amp; elevated operations rejected by the bridge</text>

  <!-- footer note -->
  <text x="480" y="540" text-anchor="middle" font-size="11" fill="#9aa0a8">data-studio-agent also powers the built-in assistants in dockit &amp; sqlkit</text>
</svg>
